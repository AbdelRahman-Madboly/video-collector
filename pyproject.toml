[project]
name = "creator-video-collector"
version = "2.0.0"
description = "Download videos into a project library with transcripts, thumbnails and summaries"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
